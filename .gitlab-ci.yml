image: python:3.14-slim

stages:
  - quality
  - test

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache
  PYTHONDONTWRITEBYTECODE: "1"

cache:
  paths:
    - .uv-cache/

before_script:
  - apt-get update && apt-get install -y --no-install-recommends curl make && rm -rf /var/lib/apt/lists/*
  - curl -LsSf https://astral.sh/uv/0.9.28/install.sh | sh
  - export PATH="$HOME/.local/bin:$PATH"
  - uv sync --all-groups

quality:
  stage: quality
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy src tests
    - uv run pre-commit run --all-files

test:
  stage: test
  script:
    - uv run pytest
