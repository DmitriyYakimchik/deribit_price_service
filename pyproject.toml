[project]
name = "crypto-price-service"
version = "0.1.0"
description = "Collect Deribit BTC/ETH index prices and expose a FastAPI API."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery[redis]==5.6.3",
    "fastapi>=0.143.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.19.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.14",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_prices"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["crypto_prices"]
strict = true
ignore_missing_imports = true
local_partial_types = true
warn_unreachable = true
show_error_codes = true
plugins = []
enable_error_code = [
    "truthy-bool",
    "truthy-iterable",
    "redundant-expr",
    "unused-awaitable",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-self",
    "unimported-reveal",
    "deprecated",
    "exhaustive-match",
]
disable_error_code = [
    "unused-ignore",
    "no-any-return",
]

[[tool.mypy.overrides]]
module = ["celery.*", "aiohttp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
